<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 340" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <title>Where to put the camera</title>
  <rect width="880" height="340" fill="#ffffff"/>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Side view -->
  <text x="220" y="30" text-anchor="middle" font-weight="600" fill="#111">Side view</text>
  <rect x="40" y="150" width="34" height="24" rx="4" fill="#333"/>
  <circle cx="74" cy="162" r="6" fill="#888"/>
  <text x="57" y="200" text-anchor="middle" fill="#333">camera</text>
  <path d="M80,162 L330,95 L330,265 z" fill="#1565c0" fill-opacity="0.08" stroke="#1565c0" stroke-dasharray="5 4"/>
  <!-- person side -->
  <circle cx="360" cy="110" r="26" fill="#ffd9b8" stroke="#333" stroke-width="2"/>
  <path d="M332,104 A28,28 0 0 1 388,104 L388,112 L332,112 z" fill="#555"/>
  <path d="M345,140 L375,140 L385,250 L340,250 z" fill="#90a4ae" stroke="#333" stroke-width="2"/>
  <rect x="330" y="250" width="70" height="12" fill="#795548"/>
  <line x1="80" y1="295" x2="350" y2="295" stroke="#333" stroke-width="2" marker-start="url(#a)" marker-end="url(#a)"/>
  <text x="215" y="320" text-anchor="middle" fill="#111" font-weight="600">about 1 metre</text>
  <text x="215" y="70" text-anchor="middle" fill="#555">level with the face, fixed in place</text>

  <!-- Camera view: good -->
  <text x="555" y="30" text-anchor="middle" font-weight="600" fill="#2e7d32">Good: head and both shoulders</text>
  <rect x="470" y="45" width="170" height="130" rx="6" fill="#f4f6f8" stroke="#2e7d32" stroke-width="3"/>
  <circle cx="555" cy="95" r="22" fill="#ffd9b8" stroke="#333"/>
  <path d="M510,175 C510,135 530,125 555,125 C580,125 600,135 600,175 z" fill="#90a4ae" stroke="#333"/>
  <circle cx="522" cy="135" r="5" fill="#ff8f00"/>
  <circle cx="588" cy="135" r="5" fill="#ff8f00"/>
  <line x1="522" y1="135" x2="588" y2="135" stroke="#ff8f00" stroke-width="3"/>

  <!-- Camera view: too close -->
  <text x="760" y="30" text-anchor="middle" font-weight="600" fill="#c62828">Too close: shoulders not seen</text>
  <rect x="675" y="45" width="170" height="130" rx="6" fill="#f4f6f8" stroke="#c62828" stroke-width="3"/>
  <clipPath id="close"><rect x="675" y="45" width="170" height="130" rx="6"/></clipPath>
  <g clip-path="url(#close)">
    <circle cx="760" cy="125" r="70" fill="#ffd9b8" stroke="#333"/>
  </g>
  <line x1="695" y1="60" x2="825" y2="160" stroke="#c62828" stroke-width="3"/>
  <line x1="825" y1="60" x2="695" y2="160" stroke="#c62828" stroke-width="3"/>

  <text x="657" y="215" text-anchor="middle" fill="#333">Calibration: sit upright and look at the camera for 4 seconds.</text>
  <text x="657" y="240" text-anchor="middle" fill="#333">Out of view for 3 seconds or more, and it calibrates again.</text>
  <text x="657" y="265" text-anchor="middle" fill="#333">A helmet is fine: the body keeps deciding.</text>
</svg>
