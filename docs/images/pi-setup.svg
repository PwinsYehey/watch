<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 330" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="14">
  <title>How the WATCH Raspberry Pi setup connects</title>
  <rect width="880" height="330" fill="#ffffff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
  </defs>

  <!-- Camera -->
  <g transform="translate(40,90)">
    <rect width="130" height="110" rx="10" fill="#f2f2f2" stroke="#333" stroke-width="2"/>
    <circle cx="65" cy="50" r="26" fill="#222"/>
    <circle cx="65" cy="50" r="12" fill="#555"/>
    <circle cx="69" cy="46" r="4" fill="#ddd"/>
    <text x="65" y="135" text-anchor="middle" font-weight="600" fill="#111">Camera Module 3 NoIR</text>
    <text x="65" y="154" text-anchor="middle" fill="#555">imx708_noir</text>
  </g>

  <!-- Ribbon -->
  <path d="M170,145 C210,145 220,145 260,145" stroke="#999" stroke-width="10" fill="none"/>
  <text x="215" y="125" text-anchor="middle" fill="#333">ribbon</text>
  <text x="215" y="180" text-anchor="middle" fill="#555" font-size="12">CAMERA port</text>

  <!-- Pi -->
  <g transform="translate(260,70)">
    <rect width="220" height="150" rx="10" fill="#e8f3e8" stroke="#2e7d32" stroke-width="2"/>
    <rect x="70" y="45" width="60" height="60" fill="#bdbdbd" stroke="#555"/>
    <text x="100" y="80" text-anchor="middle" font-size="11" fill="#222">CPU</text>
    <rect x="190" y="30" width="30" height="40" fill="#cfcfcf" stroke="#555"/>
    <rect x="190" y="85" width="30" height="40" fill="#cfcfcf" stroke="#555"/>
    <circle cx="20" cy="20" r="5" fill="#d32f2f"/>
    <circle cx="36" cy="20" r="5" fill="#43a047"/>
    <text x="110" y="175" text-anchor="middle" font-weight="600" fill="#111">Raspberry Pi 4</text>
    <text x="110" y="194" text-anchor="middle" fill="#555">runs WATCH at boot</text>
  </g>
  <text x="300" y="60" fill="#555" font-size="12">red = power, green blinking = working</text>

  <!-- Power -->
  <line x1="370" y1="290" x2="370" y2="222" stroke="#333" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="370" y="310" text-anchor="middle" fill="#333">5 V 3 A USB-C power</text>

  <!-- Ethernet -->
  <line x1="482" y1="145" x2="628" y2="145" stroke="#1565c0" stroke-width="4" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="555" y="122" text-anchor="middle" fill="#1565c0" font-weight="600">Ethernet cable</text>
  <text x="555" y="174" text-anchor="middle" fill="#555" font-size="12">or the same Wi-Fi</text>

  <!-- Laptop -->
  <g transform="translate(630,80)">
    <rect width="200" height="125" rx="8" fill="#f7f7f7" stroke="#333" stroke-width="2"/>
    <rect x="12" y="12" width="176" height="100" fill="#14171d"/>
    <rect x="22" y="22" width="90" height="70" fill="#3a3f4a"/>
    <rect x="120" y="22" width="58" height="20" fill="#d32f2f"/>
    <rect x="120" y="48" width="58" height="8" fill="#555"/>
    <rect x="120" y="62" width="58" height="8" fill="#555"/>
    <rect x="120" y="76" width="58" height="8" fill="#555"/>
    <path d="M-15,125 L215,125 L230,140 L-30,140 z" fill="#ddd" stroke="#333" stroke-width="2"/>
    <text x="100" y="168" text-anchor="middle" font-weight="600" fill="#111">Laptop browser</text>
    <text x="100" y="187" text-anchor="middle" fill="#1565c0">raspberrypi.local:8766</text>
  </g>
</svg>
