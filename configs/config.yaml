# FRAMES - Facial Recognition & Alertness Monitoring Engine System central config.

project:
  name: frames
  seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  splits_dir: data/splits
  models_dir: models
  results_dir: results

datasets:
  # Each dataset gets its own raw subfolder under paths.raw_dir.
  mrl_eye:
    raw_subdir: mrl_eye
    enabled: true
  cew:
    raw_subdir: cew
    enabled: true

split:
  # Split is done by subject/session id, never by individual image.
  ratios:
    train: 0.70
    val: 0.20
    test: 0.10
  group_by: subject_id

preprocessing:
  image_size: [64, 64]
  grayscale: false

model:
  # Ground truth is eye state (closed/open), not alert/drowsy -- see alertness section below.
  architecture: custom_cnn   # one of: custom_cnn, mobilenetv2
  dropout_rate: 0.5
  dense_units: 128
  learning_rate: 0.0001
  num_classes: 2
  class_names: [closed, open]

training:
  batch_size: 64
  epochs: 30
  early_stopping_patience: 5
  reduce_lr_patience: 2

grid_search:
  architectures: [custom_cnn, mobilenetv2]
  dropout_rates: [0.3, 0.5]
  dense_units: [64, 128]
  learning_rates: [0.0001, 0.00001]
  epochs_per_run: 15

alertness:
  # Turns per-frame eye-closedness into a live alert/drowsy judgement.
  closed_duration_threshold_sec: 1.5
  perclos_window_sec: 5.0
  perclos_threshold: 0.5
  closedness_threshold: 0.4

ear:
  # Eye Aspect Ratio thresholds, untuned starting values -- may need calibration.
  open_threshold: 0.30
  closed_threshold: 0.20
