# WATCH - Wakefulness Assessment through Tracking of Cues & Head.

seed: 42

paths:
  raw_dir: data/raw
  splits_dir: data/splits
  models_dir: models
  results_dir: results
  web_dir: web

# Raw image folders per model, relative to paths.raw_dir.
datasets:
  eye:
    mrl_eye: eye/mrl_eye
    cew: eye/cew
    nthu_eye: eye/nthu_eye
    yawdd_eye: eye/yawdd_eye
  yawn:
    yawdd: yawn/yawdd

split:
  ratios: {train: 0.70, val: 0.20, test: 0.10}
  # NTHU has only 4 subjects and YawDD only 13 people in sunglasses, so pin some of them out of train.
  force:
    {
      "nthu_eye::002": test,
      "nthu_eye::006": val,
      "yawdd_eye::female17": test,
      "yawdd_eye::female22": test,
      "yawdd_eye::male38": test,
      "yawdd_eye::female18": val,
      "yawdd_eye::male36": val,
    }

image_size: [64, 64]

models:
  eye:
    class_names: [eyes_closed, eyes_opened, blocked]
    positive_class: eyes_closed
    unreadable_class: blocked
    unreadable_threshold: 0.9
    grayscale: true
    architecture: custom_cnn
    dropout_rate: 0.5
    dense_units: 128
    learning_rate: 0.0001
    batch_size: 64
    epochs: 30
    early_stopping_patience: 5
    reduce_lr_patience: 2
  yawn:
    class_names: [no_yawn, yawn, blocked]
    positive_class: yawn
    unreadable_class: blocked
    unreadable_threshold: 0.7
    grayscale: false
    architecture: tiny_cnn
    dropout_rate: 0.5
    dense_units: 64
    learning_rate: 0.001
    batch_size: 32
    epochs: 80
    early_stopping_patience: 8
    reduce_lr_patience: 3

sweep:
  architectures: [custom_cnn, mobilenetv2]
  dropout_rates: [0.3, 0.5]
  dense_units: [64, 128]
  learning_rates: [0.0001, 0.00001]
  epochs: 15

extraction:
  nthu: {frame_stride: 3, max_frames_per_group: 150}
  yawdd:
    max_frames_per_video: 40
    frame_stride: {normal: 10, talking: 10, yawning: 3}

# Per-cue alert logic: not_alert after a sustained streak or a high average over the window.
alertness:
  closed_duration_threshold_sec: 1.5
  perclos_window_sec: 5.0
  perclos_threshold: 0.75
  closedness_threshold: 0.85

yawn:
  closed_duration_threshold_sec: 2.0
  perclos_window_sec: 8.0
  perclos_threshold: 0.8
  closedness_threshold: 0.5
  dip_grace_period_sec: 0.5

# A cue event (eyes, yawn or head crossing the limits above) gives a warning. A repeat, a second cue,
# or the event lasting persist_sec within window_sec makes it critical. Critical clears after calm_sec.
escalation:
  window_sec: 30.0
  calm_sec: 5.0
  persist_sec: {eyes: 3.0, mouth: null, head: 4.0, body: 4.0, nodding: null, still: 30.0, check_in: 5.0}
  repeat_count: {eyes: 2, mouth: 3, head: 2, body: 2, nodding: 2, still: 2, check_in: 2}

# Head counts as drooped only once it reaches the full drooped angle below.
nod:
  closed_duration_threshold_sec: 1.5
  perclos_window_sec: 6.0
  perclos_threshold: 0.9
  closedness_threshold: 1.0
  dip_grace_period_sec: 0.0

# Upper-body posture from the shoulders and head, against the calibrated sitting posture. It decides alone in body mode,
# and otherwise counts once the face is covered.
body:
  # Pose runs every every_n_frames frames, or every body_mode_every_n_frames in body mode, where the face models are
  # not run. Every frame overloaded a Pi 4 until it froze.
  every_n_frames: 3
  body_mode_every_n_frames: 2
  min_visibility: 0.5
  # Slumped once the shoulders drop this many shoulder widths, the shoulder line tilts this far past calibration,
  # the head drops this far toward the shoulders, or the shoulders look this much wider from leaning toward the camera.
  drop_limit: 0.06
  lean_limit_deg: 6.0
  head_drop_limit: 0.15
  forward_limit: 0.12
  upright_rise: 0.02
  # A nod is the head dropping nod_drop shoulder widths and coming back up within nod_max_sec; nods_limit nods within
  # nods_window_sec means nodding off.
  nod_drop: 0.12
  nod_max_sec: 2.5
  nods_window_sec: 60.0
  nods_limit: 3
  # No movement means the shoulders and head stayed within still_limit shoulder widths for still_window_sec.
  still_window_sec: 45.0
  still_limit: 0.05

check_in:
  blind_sec: 60.0
  answer_sec: 5.0

slump:
  closed_duration_threshold_sec: 2.0
  perclos_window_sec: 6.0
  perclos_threshold: 0.9
  closedness_threshold: 1.0
  dip_grace_period_sec: 0.5

# Defaults used until per-user calibration replaces them.
ear:
  open_threshold: 0.35
  closed_threshold: 0.10

mar:
  closed_threshold: 0.3
  open_threshold: 0.6

head_pose:
  upright_threshold: 8
  drooped_threshold: 33
  roll_upright_threshold: 5
  roll_drooped_threshold: 30

# Drooped offsets are degrees past the user's resting pose: clearly looking down, or head near the shoulder.
calibration:
  duration_sec: 4.0
  closed_offset: 0.10
  # A resting EAR below this means the eyes were hidden, such as by sunglasses, so the default EAR thresholds stay.
  min_open_ear: 0.20
  drooped_offset: 25.0
  roll_drooped_offset: 25.0

live:
  # both: the face (eyes, yawning, head) and body language (posture, nodding, leaning forward, stillness) count together,
  # so it works with and without a helmet.
  # body: body language alone, for users in helmets; the face models are not run, which is lighter on a Pi.
  # face: the face, with body language only once the face is covered.
  mode: both
  min_cnn_confidence: 0.65
  covered_mouth_yawn: 0.8
  eye_blur: 3
  # shape_gate: the CNN counts only when the eye shape also looks closed. cnn: the CNN decides alone,
  # for a model fine-tuned on recordings through tinted lenses, where the eye shape is a guess.
  eye_decision: cnn
  ear_glare_tolerance: 0.15
  low_detail_std: 8.0
  # Frames darker than low_light_mean are brightened to low_light_target.
  low_light_mean: 0.3
  low_light_target: 0.45
  # Crops tilted more than this are rotated level.
  level_min_angle_deg: 15
  sharp_min: 100.0
  camera_retry_sec: 1.0
  camera_lost_alarm_sec: 3.0
  # BCM pin of the low-trigger buzzer module (physical pin 7), or null for none.
  buzzer_gpio: 4
  blurry_below: 40.0
  face_detection_confidence: 0.3
  face_tracking_confidence: 0.5
  recalibrate_gap_sec: 3.0
  # An alert held while nobody is in view is cleared after this long, so it cannot stay on with no way to clear it.
  lost_reset_sec: 5.0
  smoothing_window: 5

# Labelled eye crops recorded on the device, cued by the buzzer: one beep for open, two for closed, a long beep at the end.
record:
  dir: eye/own_eye
  segments: [[open, 12], [closed, 6], [open, 12], [closed, 6], [open, 12], [closed, 6]]
  # Frames this soon after a cue are skipped while the eyes react.
  settle_sec: 1.0

# Fine-tunes the trained eye model on the recordings above. Whole takes are held out for testing.
finetune:
  learning_rate: 0.00005
  epochs: 15
  early_stopping_patience: 4
  test_fraction: 0.25
  # Takes to test on instead of a random test_fraction of them, such as one recorded through sunglasses.
  test_takes: [yeri_shades3]
  train_head_only: true
