# FRAMES - Facial Recognition & Alertness Monitoring Engine System
# Central configuration. Scripts under scripts/ read this file instead of
# hardcoding paths/hyperparameters, so the whole pipeline is reproducible
# and portable across machines.

project:
  name: frames
  seed: 42

paths:
  raw_dir: data/raw
  processed_dir: data/processed
  splits_dir: data/splits
  models_dir: models
  results_dir: results

datasets:
  # Each dataset gets its own raw subfolder under paths.raw_dir.
  # subject_pattern documents how a subject/session id is recovered from a
  # filename or folder name -- required so splitting can be subject-disjoint.
  mrl_eye:
    raw_subdir: mrl_eye
    enabled: true
  cew:
    raw_subdir: cew
    enabled: true

split:
  # Split is done by subject/session id, never by individual image, to avoid
  # the leakage problem found in the original motorcycle-rider dataset.
  ratios:
    train: 0.70
    val: 0.20
    test: 0.10
  group_by: subject_id

preprocessing:
  image_size: [64, 64]
  grayscale: false

model:
  # MRL/CEW ground truth is eye state (closed/open), not alert/drowsy.
  # A single closed-eye frame could just be a blink -- "drowsy" is a
  # temporal judgement (e.g. PERCLOS / sustained closure) built on top of
  # this classifier's output, not a label this classifier is trained on.
  architecture: custom_cnn   # one of: custom_cnn, mobilenetv2
  dropout_rate: 0.5
  dense_units: 128
  learning_rate: 0.0001
  num_classes: 2
  class_names: [closed, open]

training:
  batch_size: 64
  epochs: 30
  early_stopping_patience: 5
  reduce_lr_patience: 2

grid_search:
  architectures: [custom_cnn, mobilenetv2]
  dropout_rates: [0.3, 0.5]
  dense_units: [64, 128]
  learning_rates: [0.0001, 0.00001]
  epochs_per_run: 15
