# FRAMES - Facial Recognition & Alertness Monitoring Engine System central config.

project:
  name: frames
  seed: 42

paths:
  raw_dir: data/raw
  splits_dir: data/splits
  models_dir: models
  results_dir: results

datasets:
  # Each dataset gets its own raw subfolder under paths.raw_dir.
  mrl_eye:
    raw_subdir: mrl_eye
    enabled: true
  cew:
    raw_subdir: cew
    enabled: true
  nthu_eye:
    # Real subject ids from NTHU-DDD, extracted via cli/extract_nthu.py; adds glasses-wearing subject diversity MRL/CEW lack.
    raw_subdir: nthu_eye
    enabled: true

yawn_dataset:
  yawdd:
    # Real subject ids from the YawDD Mirror set, extracted via cli/extract_yawdd.py.
    raw_subdir: yawdd
    enabled: true

split:
  # Split is done by subject/session id, never by individual image.
  ratios:
    train: 0.70
    val: 0.20
    test: 0.10
  group_by: subject_id

preprocessing:
  image_size: [64, 64]
  grayscale: false

model:
  # Ground truth is eye state (closed/open), not alert/not_alert -- see alertness section below.
  architecture: custom_cnn   # one of: custom_cnn, mobilenetv2
  dropout_rate: 0.5
  dense_units: 128
  learning_rate: 0.0001
  num_classes: 2
  class_names: [closed, open]

training:
  batch_size: 64
  epochs: 30
  early_stopping_patience: 5
  reduce_lr_patience: 2

yawn_model:
  architecture: tiny_cnn
  dropout_rate: 0.5
  dense_units: 64
  learning_rate: 0.0001
  num_classes: 2
  class_names: [no_yawn, yawn]

yawn_training:
  batch_size: 32
  epochs: 30
  early_stopping_patience: 8
  reduce_lr_patience: 3

grid_search:
  architectures: [custom_cnn, mobilenetv2]
  dropout_rates: [0.3, 0.5]
  dense_units: [64, 128]
  learning_rates: [0.0001, 0.00001]
  epochs_per_run: 15

alertness:
  # Turns per-frame eye-closedness into a live alert/not_alert judgement.
  closed_duration_threshold_sec: 1.5
  perclos_window_sec: 5.0
  perclos_threshold: 0.5
  closedness_threshold: 0.85

ear:
  # Fallback thresholds used only if live per-user calibration fails.
  open_threshold: 0.35
  closed_threshold: 0.10

calibration:
  # live.py measures each user's own open-eye EAR at startup so the threshold fits their eye shape.
  duration_sec: 4.0
  closed_fraction: 0.3

mar:
  # Mouth Aspect Ratio thresholds -- 0.6 also marks the yawn cutoff used when filtering YawDD frames.
  closed_threshold: 0.3
  open_threshold: 0.6

yawn:
  # Sustained wide-mouth duration counts as yawning, unlike a quick talk/laugh.
  closed_duration_threshold_sec: 3.0
  perclos_window_sec: 8.0
  perclos_threshold: 0.8
  closedness_threshold: 0.5
  dip_grace_period_sec: 0.5

head_pose:
  # Head pitch (degrees) thresholds, calibrated from observed neutral (~5deg) and nodding (~20deg) values.
  upright_threshold: 8
  drooped_threshold: 20

nod:
  # Sustained head-droop duration counts as nodding off; no dip_grace_period, unlike yawn.
  closed_duration_threshold_sec: 2.0
  perclos_window_sec: 6.0
  perclos_threshold: 0.6
  closedness_threshold: 0.5
  dip_grace_period_sec: 0.0
