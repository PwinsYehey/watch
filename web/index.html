<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>FRAMES</title>
  <style>
    body { background: #111; color: #eee; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
    h1 { font-size: 22px; font-weight: bold; letter-spacing: 2px; margin: 0; }
    .subtitle { font-size: 14px; color: #999; margin: 4px 0 0; }
    .testing-tag { font-size: 12px; color: #666; margin: 2px 0 16px; text-transform: uppercase; letter-spacing: 1px; }
    .stage-row { display: flex; flex-wrap: wrap; justify-content: center; align-items: flex-start; gap: 16px; }
    .stage-panel { max-width: 100%; }
    .panel-label { font-size: 12px; color: #999; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; }
    .stage { position: relative; display: inline-block; max-width: 100%; }
    video { display: none; }
    canvas { max-width: 100%; height: auto; border: 1px solid #333; display: block; }
    #output.capturable { cursor: pointer; }
    .capture-hint { margin-top: 6px; font-size: 12px; color: #999; }
    #status { margin-top: 6px; color: #0cf; min-height: 14px; }
    .actions-row { margin-top: 16px; display: flex; justify-content: center; gap: 16px; }
    #startBtn, .upload-btn { padding: 10px 24px; font-size: 15px; cursor: pointer; background: #2a2a2a; color: #eee; border: 1px solid #555; border-radius: 4px; display: inline-flex; align-items: center; gap: 8px; }
    #startBtn:hover, .upload-btn:hover { background: #0cf; color: #111; border-color: #0cf; }
    .upload-btn.disabled { opacity: 0.5; pointer-events: none; }
    .btn-icon { width: 16px; height: 16px; flex-shrink: 0; }
    #muteBtn { display: none; margin-top: 10px; padding: 10px 24px; font-size: 15px; cursor: pointer; }
    .paste-hint { margin-top: 10px; font-size: 13px; color: #999; }
    #imageUpload { display: none; }
    footer { margin-top: 4px; font-size: 12px; color: #555; }

    @media (max-width: 480px) {
      body { padding: 12px; }
      .actions-row { gap: 10px; flex-wrap: wrap; }
      #startBtn, .upload-btn { padding: 10px 16px; font-size: 14px; }
    }
  </style>
</head>
<body>
  <h1>F.R.A.M.E.S</h1>
  <p class="subtitle">Facial Recognition & Alertness Monitoring Engine System</p>
  <p class="testing-tag">Testing environment</p>
  <div class="stage-row">
    <div class="stage-panel" id="originalPanel" hidden>
      <div class="panel-label">Original</div>
      <canvas id="originalOutput" width="640" height="480"></canvas>
    </div>
    <div class="stage-panel">
      <div class="panel-label" id="scannedLabel" hidden>Scanned</div>
      <div class="stage">
        <video id="video" autoplay playsinline muted></video>
        <canvas id="output" width="640" height="480"></canvas>
      </div>
      <p class="capture-hint" id="captureHint" hidden>Click the video to capture a photo for detailed analysis.</p>
    </div>
  </div>
  <div class="actions-row">
    <button id="startBtn">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v10a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="14" r="3.5"/></svg>
      <span id="startBtnLabel">Use camera</span>
    </button>
    <label for="imageUpload" class="upload-btn" id="uploadBtn">
      <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M7 9l5-5 5 5M4 16v3a1 1 0 0 0 1 1h14a1 1 0 0 0 1-1v-3"/></svg>
      Upload
    </label>
    <input type="file" id="imageUpload" accept="image/*" />
  </div>
  <p class="paste-hint">or paste one (Ctrl+V) anywhere on this page.</p>
  <button id="muteBtn">Mute Alarm</button>
  <div id="status"></div>

  <script src="lib/tf.min.js?v=9"></script>
  <script src="lib/tf-backend-wasm.min.js?v=9"></script>
  <script src="lib/blazeface.min.js?v=1"></script>
  <script src="config.js?v=16"></script>
  <script src="geometry.js?v=15"></script>
  <script src="alertness.js?v=10"></script>
  <script type="module" src="app.js?v=42"></script>

  <footer>Property of Prince Herrera, Ormin Cariaso, John Casili, Christenzien Lalimo</footer>
</body>
</html>
