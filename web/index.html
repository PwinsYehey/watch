<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FRAMES</title>
  <style>
    body { background: #111; color: #eee; font-family: sans-serif; text-align: center; margin: 0; padding: 20px; }
    h1 { font-size: 22px; font-weight: bold; letter-spacing: 2px; margin: 0; }
    .subtitle { font-size: 14px; color: #999; margin: 4px 0 0; }
    .testing-tag { font-size: 12px; color: #666; margin: 2px 0 16px; text-transform: uppercase; letter-spacing: 1px; }
    .stage { position: relative; display: inline-block; }
    video { display: none; }
    canvas { max-width: 100%; border: 1px solid #333; }
    #status { margin-top: 10px; color: #0cf; min-height: 20px; }
    #startBtn, #muteBtn { margin-top: 10px; padding: 10px 24px; font-size: 15px; cursor: pointer; }
    #muteBtn { display: none; margin-left: 8px; }
    .upload-row { margin-top: 16px; font-size: 13px; color: #999; }
    footer { margin-top: 30px; font-size: 12px; color: #555; }
  </style>
</head>
<body>
  <h1>F.R.A.M.E.S</h1>
  <p class="subtitle">Facial Recognition & Alertness Monitoring Engine System</p>
  <p class="testing-tag">Testing environment</p>
  <div class="stage">
    <video id="video" autoplay playsinline muted></video>
    <canvas id="output"></canvas>
  </div>
  <div>
    <button id="startBtn">Start</button>
    <button id="muteBtn">Mute Alarm</button>
  </div>
  <div class="upload-row">
    <label for="imageUpload">Or test a single image: upload a file, or paste one (Ctrl+V) anywhere on this page.</label><br />
    <input type="file" id="imageUpload" accept="image/*" />
  </div>
  <div id="status"></div>

  <script src="lib/tf.min.js?v=9"></script>
  <script src="lib/tf-backend-wasm.min.js?v=9"></script>
  <script src="config.js?v=16"></script>
  <script src="geometry.js?v=15"></script>
  <script src="alertness.js?v=10"></script>
  <script type="module" src="app.js?v=30"></script>

  <footer>Property of Prince Herrera, Ormin Cariaso, John Casili, Christenzien Lalimo</footer>
</body>
</html>
